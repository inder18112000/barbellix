# React Router does client-side routing, so a request for e.g. /admin/members has no matching
# file on disk - nginx must fall back to index.html and let the React app's router take over,
# instead of returning its default 404.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
